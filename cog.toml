branch_whitelist = [ "main" ]
[changelog]
authors = [ { signature = "Gabriel Santos de Souza", username = "gbr-ufs" } ]
owner = "gbr-ufs"
remote = "github.com"
repository = "tubenoisseur"
template = "package_remote"
[git_hooks.commit-msg]
script = """
#!/bin/sh
set -e
cog verify --file $1
cog check
"""
